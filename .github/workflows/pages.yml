name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: generator/package-lock.json
      - run: npm ci --prefix generator
      - run: npx --prefix generator playwright install --with-deps chromium
      - run: node tools/build.js --regenerate
      - run: node generator/audit.js
      - run: python tools/check_links.py
      - name: Browser regression under the project URL prefix
        shell: bash
        run: |
          python tools/serve.py > /tmp/mia-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/Lop_5_Mia/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/qa.js --no-shots
          node tools/qa_listening.js
          node tools/qa_english_unit1.js
          node tools/qa_english_units23.js
          node tools/qa_english_units.js --units=4,5
          node tools/qa_theme.js
          node tools/qa_home.js
          node tools/qa_drafts.js
          node tools/responsive.js --no-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
